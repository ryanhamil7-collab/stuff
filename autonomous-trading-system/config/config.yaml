
trading:
  initial_capital: 100000.0
  max_position_size: 0.10  # Max 10% per symbol
  stop_loss_pct: 0.02  # 2% stop loss
  take_profit_pct: 0.05  # 5% take profit
  max_positions: 10
  min_volume: 1000000  # Minimum daily volume
  min_volatility: 0.02  # Minimum 2% volatility
  trading_hours:
    start: "09:30"
    end: "16:00"
    timezone: "America/New_York"
  
  hybrid_mode:
    mode: "hybrid"
    intraday_allocation: 0.6
    interday_allocation: 0.4
  
  fee_slippage:
    base_commission_pct: 0.001
    min_commission: 1.0
    base_slippage_bps: 5
    market_impact_factor: 0.1
    volatility_multiplier: 2.0
    time_of_day_adjustments:
      market_open: 1.5
      market_close: 1.3
      midday: 1.0
  
  high_risk:
    enabled: false
    leverage: 7.0
    position_size_pct: 0.25
    min_volatility: 0.05
    intraday_allocation: 0.8
    emergency_stop_pct: 0.30
    delay_multiplier: 1.5
    slippage_multiplier: 1.2
    max_positions: 3
    target_return_annual: 4.0

data:
  primary_source: "yfinance"
  backup_sources:
    - "alpha_vantage"
    - "finnhub"
  update_interval: 300  # 5 minutes in seconds
  historical_days: 365
  
  multimodal:
    enabled: true
    cache_embeddings: true
    vector_store: "faiss"
  
symbols:
  watchlists:
    - "SP500"
    - "NASDAQ100"
  custom_symbols:
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "NVDA"
    - "TSLA"
    - "META"
    - "AMZN"
    - "AMD"
    - "NFLX"
    - "COIN"
  discovery:
    enabled: true
    scan_interval: 86400  # Daily
    criteria:
      min_volume: 1000000
      min_price: 5.0
      max_price: 1000.0
      min_volatility: 0.02

indicators:
  sma_periods: [20, 50, 200]
  ema_periods: [12, 26]
  rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    period: 20
    std: 2
  atr_period: 14

llm:
  model_name: "mistralai/Mixtral-8x7B-Instruct-v0.1"
  quantization: "4bit"
  max_length: 4096
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  use_structured_thesis: true
  compress_after_training: false
  batch_size: 32
  
  ensemble:
    enabled: true
    models:
      - name: "mistralai/Mixtral-8x7B-Instruct-v0.1"
        weight: 0.5
        quantization: "4bit"
      - name: "meta-llama/Meta-Llama-3-8B-Instruct"
        weight: 0.3
        quantization: "4bit"
      - name: "mistralai/Mistral-7B-Instruct-v0.2"
        weight: 0.2
        quantization: "4bit"
    voting_strategy: "weighted"
  
  fine_tune:
    enabled: true
    method: "lora"
    rank: 8
    alpha: 32
    dropout: 0.1
    update_interval: 604800  # Weekly
  
  testing_models:
    - "microsoft/DialoGPT-medium"
    - "google/gemma-2b-it"
    - "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

rl:
  algorithm: "PPO"  # Options: PPO, PPO_GRPO
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_sharpe: 1.5
  
  live_training:
    enabled: true
    buffer_size: 10000
    update_frequency: 100
    min_experiences: 64
    save_interval: 1000
  
  grpo:
    enabled: false
    group_size: 4
    oracle_weight: 0.3
    volatility_penalty: 0.5
    reference_model: null  # Optional: "meta-llama/Meta-Llama-3.1-70B-Instruct"

genetic:
  population_size: 50
  generations: 100
  mutation_rate: 0.2
  crossover_rate: 0.8
  tournament_size: 3
  elitism: 0.1

alpha:
  num_alphas: 100
  evaluation_metrics:
    - "RankIC"
    - "ICIR"
    - "turnover"
    - "diversity"
  min_rankic: 0.02
  max_turnover: 0.3

risk:
  max_drawdown: 0.20  # 20% max drawdown
  position_sizing: "kelly"
  kelly_fraction: 0.25  # Quarter Kelly
  diversification: true
  correlation_threshold: 0.7

backtest:
  start_date: "2010-01-01"
  end_date: "2025-01-01"
  commission: 0.0005  # 0.05% (5 bps per trade)
  slippage: 0.001  # 0.1% (10 bps slippage)
  monte_carlo_runs: 100
  
  execution_delays:
    enabled: true
    fixed_delay_ms: 200.0
    use_variable_delay: true
    delay_mean_ms: 200.0
    delay_std_ms: 50.0
    delay_distribution: "normal"
    integrate_slippage: true
    slippage_bps: 10.0
    slippage_std_bps: 5.0
    model_partial_fills: true
    min_fill_rate: 0.8
    liquidity_threshold: 1000000.0
    regime_based_delays: true
    high_volatility_multiplier: 1.5
    low_liquidity_multiplier: 2.0
    data_feed_delay_ms: 100.0
    broker_processing_ms: 50.0
    network_jitter_ms: 20.0
  
  walk_forward:
    enabled: false
    train_window: 365  # 1 year training
    test_window: 90    # 90 days testing
    step_size: 90      # 90 days step forward
  
  monte_carlo:
    enabled: false
    num_simulations: 1000
    slippage_std: 0.001
    regime_probs:
      bull: 0.3
      bear: 0.2
      sideways: 0.5
  
  regime_detection:
    enabled: false
    n_regimes: 3
    method: "hmm"
  
  validation:
    lookahead_check: true
    overfitting_threshold: 0.7  # val_sharpe < train_sharpe * 0.7 = overfitting
    early_stopping: true

metrics:
  target_sharpe: 1.5
  target_sortino: 2.0
  max_drawdown: 0.20
  min_win_rate: 0.55

sentiment:
  model: "ProsusAI/finbert"
  news_sources:
    - "finnhub"
    - "alpha_vantage"
  lookback_days: 7
  sentiment_threshold: 0.1

agents:
  data_agent:
    enabled: true
    priority: 1
  analysis_agent:
    enabled: true
    priority: 2
  decision_agent:
    enabled: true
    priority: 3
  optimization_agent:
    enabled: true
    priority: 4
    hypothesis_generation:
      enabled: true
      num_hypotheses: 3
      confidence_threshold: 0.7

autopilot:
  enabled: true
  mode: "paper"  # paper or live (NEVER use live)
  check_interval: 300  # 5 minutes
  max_runtime: null  # null for continuous
  
  strategy_horizon: "hybrid"  # Options: intraday, interday, hybrid
  hybrid:
    intraday_allocation: 0.6  # 60% for intraday (volatile symbols)
    interday_allocation: 0.4  # 40% for interday (stable symbols)
    intraday_timeframe: "5min"
    interday_timeframe: "1day"
    intraday_symbols: ["TSLA", "NVDA", "AMD", "COIN"]  # Volatile
    interday_symbols: ["MSFT", "AAPL", "GOOGL", "JPM"]  # Stable
  
  offline_research:
    enabled: true
    sleep_start: "18:00"  # 6 PM ET
    sleep_end: "09:00"    # 9 AM ET
    tasks:
      - "aggregate_news"
      - "backtest_hypotheses"
      - "evolve_strategies"
      - "fine_tune_llm"
      - "monte_carlo_optimization"
    improvement_target: 0.15  # 10-15% improvement target
  
database:
  type: "sqlite"
  path: "data/knowledge_base/trading.db"
  vector_store: "faiss"
  vector_dim: 768

logging:
  level: "INFO"
  file: "logs/trading_system.log"
  max_size: "100MB"
  backup_count: 10

dashboard:
  enabled: true
  port: 8501
  host: "0.0.0.0"
  refresh_interval: 60

safety:
  paper_trading_only: true
  max_daily_trades: 100
  max_daily_loss: 0.05  # 5% of capital
  circuit_breaker: true
  
api_keys:
  alpha_vantage: "${ALPHA_VANTAGE_API_KEY}"
  finnhub: "${FINNHUB_API_KEY}"
  huggingface: "${HUGGINGFACE_TOKEN}"

research:
  enabled: true
  start_time: "18:00"
  end_time: "09:00"
  min_data_days: 30
  hypothesis_per_cycle: 5
  backtest_lookback_days: 90
  genetic_generations: 100
  genetic_population: 50
  llm_finetune_enabled: true
  llm_finetune_epochs: 3
  save_results: true
  data_dir: "research_data"

optimization:
  quantum:
    enabled: false  # Requires quantum hardware or simulator
    backend: "qiskit"  # Options: qiskit, pyquil, classical_fallback
    num_qubits: 10
    num_iterations: 100
    classical_fallback: true

federated_learning:
  enabled: false
  num_clients: 5
  rounds: 10
  local_epochs: 3
  aggregation_method: "fedavg"

neuro_symbolic:
  enabled: false
  prolog_rules_path: "rules/trading_rules.pl"
  llm_symbolic_fusion: true

scheduler:
  enabled: true
  market_hours:
    start: "09:25"  # 5 min before market open
    end: "16:00"
    timezone: "America/New_York"
  research_hours:
    start: "18:00"
    end: "09:00"
  keep_alive: true
  daemonize: false

symbol_discovery:
  enabled: true
  mode: "realtime"
  frequency_minutes: 15
  max_symbols: 20
  include_crypto: true
  include_options: true
  hive_broadcast: true
  min_volume: 1000000
  min_volatility: 0.02
  min_sentiment: 0.3

hive_mind:
  enabled: false
  port: 8888
  max_peers: 10
  heartbeat_interval: 30
  consensus_threshold: 0.6
  signal_ttl: 300
  enable_federation: false
  enable_distributed_backtest: false

p2p_discovery:
  enabled: true
  mdns_enabled: true
  dht_enabled: false
  tracker_enabled: true
  service_name: "_trading_hive._tcp.local."
  mdns_multicast_group: "224.0.0.251"
  mdns_port: 5353
  discovery_interval: 60
  peer_timeout: 300
  max_peers: 20
  min_reputation: 0.5
