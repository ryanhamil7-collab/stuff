
market_hours:
  start: "09:30"
  end: "16:00"
  timezone: "America/New_York"

schedule:
  pre_market:
    enabled: true
    time: "09:00"
  
  market_open:
    enabled: true
    time: "09:30"
  
  intraday_checks:
    enabled: true
    interval_minutes: 15
  
  market_close:
    enabled: true
    time: "15:55"
  
  post_market:
    enabled: true
    time: "16:30"

hive_mind:
  enabled: false
  consensus_threshold: 0.7
  max_strategies: 5

capital:
  initial: 1000
  max_position_size: 0.2
  reserve_percentage: 0.1

symbol_discovery:
  enabled: true
  sources:
    - "S&P500"
    - "NASDAQ100"
  filters:
    min_volume: 1000000
    min_price: 5.0
    max_price: 500.0
  max_symbols: 50

risk_management:
  max_daily_loss: 0.02
  max_position_loss: 0.05
  stop_loss_percentage: 0.02
  take_profit_percentage: 0.05

backtesting:
  enabled: true
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000

logging:
  level: "INFO"
  file: "logs/trading.log"
  max_size_mb: 100
  backup_count: 5

kaggle:
  keep_alive: true
  keep_alive_interval: 300
  auto_restart: true
